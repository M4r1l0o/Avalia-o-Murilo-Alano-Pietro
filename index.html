<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerador de Senhas</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Gerador de Senhas</h1>

    <label for="campo-senha" style="width: 100%; text-align: left;">Senha:</label>
    <input type="text" id="campo-senha" readonly>

    <div class="opcoes">
      <label>
        <input type="checkbox" id="usar-maiusculas" checked>
        Letras maiúsculas
      </label>

      <label>
        <input type="checkbox" id="usar-minusculas" checked>
        Letras minúsculas
      </label>

      <label>
        <input type="checkbox" id="usar-numeros" checked>
        Números
      </label>

      <label>
        <input type="checkbox" id="usar-simbolos" checked>
        Símbolos
      </label>
    </div>

    <div id="status-senha">Senha aprovada: false</div>

    <div class="controle-tamanho">
      <button type="button" onclick="diminuiTamanho()">-</button>
      <span id="numero-senha">8</span>
      <button type="button" onclick="aumentaTamanho()">+</button>
    </div>

    <button type="button" onclick="geraSenha()">
      Gerar nova senha
    </button>
  </div>

  <script src="main.js"></script>
</body>
</html>
