<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Gerador de Senhas</title>
<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
  }

  body {
    font-family: Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px;
    background: #f3f2f2;
  }

  .container {
    width: min(100%, 700px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  h1 {
    margin: 0 0 12px;
    text-align: center;
    width: 100%;
  }

  #campo-senha {
    width: 100%;
    max-width: 100%;
    padding: 14px;
    font-size: 18px;
    border-radius: 8px;
    border: 1px solid #ccc;
    text-align: center;
  }

  .opcoes {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin: 8px 0;
  }

  .opcoes label {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .controle-tamanho {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    font-size: 20px;
  }

  #status-senha {
    min-height: 24px;
    font-weight: bold;
    text-align: center;
  }

  button {
    padding: 10px 16px;
    font-size: 16px;
    cursor: pointer;
  }

  #numero-senha {
    min-width: 30px;
    text-align: center;
    display: inline-block;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>Gerador de Senhas</h1>

    <label for="campo-senha" style="width: 100%; text-align: left;">Senha:</label>
    <input type="text" id="campo-senha" readonly>

    <div class="opcoes">
      <label>
        <input type="checkbox" id="usar-maiusculas" checked>
        Letras maiúsculas
      </label>

      <label>
        <input type="checkbox" id="usar-numeros" checked>
        Números
      </label>

      <label>
        <input type="checkbox" id="usar-simbolos" checked>
        Símbolos
      </label>
    </div>

    <div id="status-senha">Senha aprovada: false</div>

    <div class="controle-tamanho">
      <button type="button" onclick="diminuiTamanho()">-</button>
      <span id="numero-senha">8</span>
      <button type="button" onclick="aumentaTamanho()">+</button>
    </div>

    <button type="button" onclick="geraSenha()">
      Gerar nova senha
    </button>
  </div>

  <script src="main.js"></script>
</body>
</html>
